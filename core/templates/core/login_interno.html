<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Login Interno - SAC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; background:#f4f6f9; margin:0; padding:0; }
        .box { max-width:420px; margin:60px auto; background:#fff; padding:28px; border-radius:10px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
        h1 { margin:0 0 20px; font-size:24px; text-align:center; color:#1f2937; }
        label { display:block; margin:12px 0 6px; font-weight:600; color:#374151; }
        input { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; box-sizing:border-box; }
        button { width:100%; margin-top:18px; padding:12px; border:none; border-radius:8px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
        .erro { background:#fee2e2; color:#991b1b; padding:10px 12px; border-radius:8px; margin-bottom:14px; }
        .msg { background:#eef2ff; color:#3730a3; padding:10px 12px; border-radius:8px; margin-bottom:14px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Login Interno SAC</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
